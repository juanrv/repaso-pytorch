[project]
name = "pytorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juan José Restrepo", email = "juanrestrp.val@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "fastcore>=2.2.33",
    "fastprogress>=1.1.6",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.1.6",
    "matplotlib>=3.11.2",
    "notebook>=7.1.3",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
pytorch = "pytorch:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
